<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1b1526">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Open the Door</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="assets/Mallow/mallow_sitting.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <!-- In-game HUD -->
  <div id="hud" class="hidden">
    <div class="hud-row">
      <div class="chip" id="hud-time">00:00.0</div>
      <div class="progress" aria-label="Progress">
        <div class="progress-fill" id="hud-progress"></div>
        <span id="hud-progress-text">0%</span>
      </div>
      <button class="icon-btn" id="btn-sound" aria-label="Mute">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="cross" d="M16 9l6 6M22 9l-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button class="icon-btn" id="btn-pause" aria-label="Pause">
        <svg viewBox="0 0 24 24" width="20" height="20"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg>
      </button>
    </div>
    <div class="hud-sub">
      <span id="hud-jumps">0 jumps</span>
    </div>
    <div id="hint" class="hint">
      <div class="hint-hand"></div>
      <span>Drag back &amp; release to jump</span>
    </div>
  </div>

  <!-- Main menu / character select -->
  <section id="menu" class="screen">
    <div class="panel">
      <p class="eyebrow">A Mallow &amp; Mischko adventure</p>
      <h1>Open the Door</h1>
      <p class="sub">Climb all the way up to the door handle.</p>

      <div class="cats" id="cat-select">
        <button class="cat-card" data-cat="mallow">
          <div class="cat-img"><img src="assets/Mallow/mallow_sitting.png" alt="Mallow"></div>
          <div class="cat-name">Mallow</div>
          <div class="cat-desc">Fluffy &amp; grumpy</div>
        </button>
        <button class="cat-card" data-cat="mischko">
          <div class="cat-img"><img src="assets/Mischko/mischko_sitting.png" alt="Mischko"></div>
          <div class="cat-name">Mischko</div>
          <div class="cat-desc">Small &amp; sneaky</div>
        </button>
      </div>

      <div class="actions">
        <button class="btn primary" id="btn-play" disabled>Choose a cat</button>
        <button class="btn ghost hidden" id="btn-continue">Continue</button>
      </div>

      <div class="menu-foot">
        <label class="toggle">
          <input type="checkbox" id="opt-invert">
          <span class="track"><span class="knob"></span></span>
          <span>Direct aim (drag toward target)</span>
        </label>
        <p class="best" id="best-time"></p>
      </div>
    </div>
  </section>

  <!-- Pause -->
  <section id="pause" class="screen hidden">
    <div class="panel small">
      <h2>Paused</h2>
      <div class="actions col">
        <button class="btn primary" id="btn-resume">Resume</button>
        <button class="btn ghost" id="btn-restart">Restart</button>
        <button class="btn ghost" id="btn-menu">Change cat</button>
      </div>
      <label class="toggle">
        <input type="checkbox" id="opt-invert-2">
        <span class="track"><span class="knob"></span></span>
        <span>Direct aim</span>
      </label>
    </div>
  </section>

  <!-- Win -->
  <section id="win" class="screen hidden">
    <div class="panel">
      <p class="eyebrow">You made it!</p>
      <h2>Door opened!</h2>
      <div class="win-cat"><img id="win-img" src="" alt=""></div>
      <div class="stats">
        <div><span class="stat-val" id="win-time">0:00</span><span class="stat-label">Time</span></div>
        <div><span class="stat-val" id="win-jumps">0</span><span class="stat-label">Jumps</span></div>
        <div><span class="stat-val" id="win-falls">0</span><span class="stat-label">Big falls</span></div>
      </div>
      <p class="best" id="win-best"></p>
      <div class="actions">
        <button class="btn primary" id="btn-again">Play again</button>
        <button class="btn ghost" id="btn-win-menu">Menu</button>
      </div>
    </div>
  </section>

  <div id="loading" class="screen"><div class="spinner"></div></div>

  <script src="js/game.js"></script>
</body>
</html>
